name: Correo · enviar a una dirección del equipo (diseño oficial)

# Envía un correo ya armado con bc_email.py desde el VPS usando mandar_correo del
# motor (SMTP de sistema@, sin pasar por conectores que sanean el HTML). Solo
# acepta direcciones del equipo (lo valida mandar_correo).
on:
  workflow_dispatch:
    inputs:
      destino: { description: "Correo del equipo", required: true }
      asunto: { description: "Asunto", required: true }
      cc: { description: "Copia (opcional)", default: "" }
      html_b64: { description: "HTML del correo en base64", required: true }

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Enviar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DESTINO: ${{ inputs.destino }}
          ASUNTO: ${{ inputs.asunto }}
          CC: ${{ inputs.cc }}
          HTML_B64: ${{ inputs.html_b64 }}
        run: |
          printf '%s' "$HTML_B64" | ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "cat > /tmp/correo_equipo.b64"
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" DESTINO="$DESTINO" ASUNTO="$ASUNTO" CC="$CC" bash -s <<'EOF2'
          set -e
          cd /opt/ghl-ia
          PY=$(ls -d /opt/ghl-ia/.venv/bin/python /opt/ghl-ia/venv/bin/python 2>/dev/null | head -1)
          DESTINO="$DESTINO" ASUNTO="$ASUNTO" CC="$CC" $PY - <<'PYEOF'
import asyncio, base64, os
          from app.leads_request.bloqueo_no_pide_job import mandar_correo
          html_ = base64.b64decode(open("/tmp/correo_equipo.b64").read()).decode("utf-8")
          cc = [c.strip() for c in os.environ.get("CC", "").split(",") if c.strip()] or None
          ok, err = asyncio.run(mandar_correo(os.environ["DESTINO"], os.environ["ASUNTO"], html_,
                                              tipo="aviso_equipo_llamadas", cc=cc,
                                              reply_to="nicolas.soto@bigcapital.cl"))
          print("ENVIADO" if ok else f"NO ENVIADO: {err}")
          PYEOF
          rm -f /tmp/correo_equipo.b64
          EOF2
