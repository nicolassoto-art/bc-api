name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}  # típicamente "root" o "deploy"
          INSTALL_DIR: ${{ secrets.INSTALL_DIR || '/opt/bc-api' }}
          SERVICE_USER: ${{ secrets.SERVICE_USER || 'bcapi' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" bash -s <<EOF
          set -e
          cd $INSTALL_DIR
          PREV_HEAD=\$(git rev-parse HEAD)
          git fetch --depth 1 origin main
          git reset --hard origin/main
          NEW_HEAD=\$(git rev-parse HEAD)
          echo "Deploying \$PREV_HEAD → \$NEW_HEAD"

          # Reinstalar deps solo si requirements.txt cambió
          if ! git diff --quiet \$PREV_HEAD \$NEW_HEAD -- requirements.txt; then
            sudo -u $SERVICE_USER bash -lc "cd $INSTALL_DIR && .venv/bin/pip install -r requirements.txt"
          fi

          # Migrations
          sudo -u $SERVICE_USER bash -lc "cd $INSTALL_DIR && .venv/bin/alembic upgrade head"

          # Restart service (sudo solo si no somos root)
          if [ "\$(id -u)" = "0" ]; then SUDO=""; else SUDO="sudo"; fi
          \$SUDO systemctl restart bc-api.service
          sleep 2
          \$SUDO systemctl is-active --quiet bc-api.service || { echo "Service no arrancó"; exit 1; }

          # Health check
          curl -fsS http://127.0.0.1:8001/health || { echo "Health check falló"; exit 1; }
          echo "✓ Deploy OK"
          EOF
