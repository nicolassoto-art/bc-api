name: Import JetBrokers project to bc-api

on:
  workflow_dispatch:
    inputs:
      jb_id:
        description: 'JetBrokers project ID (ej: Sfp8j2Sq) — o "all" para iterar los 80'
        required: true
        default: 'Sfp8j2Sq'
      skip_assets:
        description: 'Saltear descarga de fotos y planos'
        type: boolean
        default: false
      skip_verify:
        description: 'No correr los 3 tests de verificación'
        type: boolean
        default: false
      # Nota: el importer SIEMPRE hace wipe full antes de importar (JB = single source of truth).
      # No hay flag para saltearlo: garantiza idempotencia y cero duplicados.
  # Para activar refresh masivo automático, descomentar:
  # schedule:
  #   - cron: '0 6 * * 0'  # domingo 6am UTC

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Login bc-api → JWT (via Python httpx for safer escaping)
        env:
          BC_API_EMAIL: nicolas.soto@bigcapital.cl
          BC_API_PASSWORD: ${{ secrets.BC_API_PASSWORD }}
        run: |
          set -euo pipefail
          # Debug: tamaño del password (sin revelarlo)
          python3 -c "import os; p=os.environ.get('BC_API_PASSWORD',''); print(f'BC_API_PASSWORD len={len(p)}, first={p[:2]}***{p[-2:]}, has_special={any(c in p for c in chr(36)+chr(34)+chr(92)+chr(96))}')"
          # Login con httpx (escape JSON correcto)
          JWT=$(python3 -c "
          import os, httpx, sys, json
          r = httpx.post(
              'https://bc-api.178-105-91-29.nip.io/auth/login',
              json={'email': os.environ['BC_API_EMAIL'], 'password': os.environ['BC_API_PASSWORD']},
              timeout=15.0,
          )
          if r.status_code != 200:
              sys.stderr.write(f'HTTP {r.status_code}: {r.text[:300]}\n')
              sys.exit(1)
          print(r.json()['access_token'])
          ")
          if [ -z "$JWT" ]; then echo "JWT vacío"; exit 1; fi
          echo "::add-mask::$JWT"
          echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"

      - name: Import project (incluye wipe interno + retry)
        env:
          JETBROKERS_EMAIL: ${{ secrets.JETBROKERS_EMAIL }}
          JETBROKERS_PASS:  ${{ secrets.JETBROKERS_PASS }}
          BC_API_BASE:      https://bc-api.178-105-91-29.nip.io
          HEADLESS:         '1'
          IMPORTS_DIR:      imports
        run: |
          set +e
          JB_ID="${{ github.event.inputs.jb_id }}"
          SKIP_ASSETS="${{ github.event.inputs.skip_assets == 'true' && '--skip-assets' || '' }}"
          ATTEMPT=1
          MAX_ATTEMPTS=3
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "::group::Import attempt $ATTEMPT/$MAX_ATTEMPTS"
            if [ "$JB_ID" = "all" ]; then
              python3 scripts/import_jb.py --all $SKIP_ASSETS
            else
              python3 scripts/import_jb.py "$JB_ID" $SKIP_ASSETS
            fi
            CODE=$?
            echo "::endgroup::"
            if [ $CODE -eq 0 ]; then
              echo "✓ Import OK en intento $ATTEMPT"
              exit 0
            fi
            echo "⚠ Intento $ATTEMPT falló (exit $CODE)"
            ATTEMPT=$((ATTEMPT+1))
            if [ $ATTEMPT -le $MAX_ATTEMPTS ]; then
              SLEEP=$((ATTEMPT * 30))
              echo "🕐 Esperando ${SLEEP}s antes de reintentar..."
              sleep $SLEEP
            fi
          done
          echo "❌ Import falló tras $MAX_ATTEMPTS intentos"
          exit 1

      - name: Verify (5 tests + AI Vision)
        if: ${{ github.event.inputs.skip_verify != 'true' && github.event.inputs.jb_id != 'all' }}
        env:
          JETBROKERS_EMAIL:  ${{ secrets.JETBROKERS_EMAIL }}
          JETBROKERS_PASS:   ${{ secrets.JETBROKERS_PASS }}
          BC_API_BASE:       https://bc-api.178-105-91-29.nip.io
          HEADLESS:          '1'
          IMPORTS_DIR:       imports
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/verify_jb_all.py "${{ github.event.inputs.jb_id }}"
        continue-on-error: true

      - name: Job summary (visible en GH UI)
        if: always()
        run: |
          JB_ID="${{ github.event.inputs.jb_id }}"
          REPORT="imports/$JB_ID/report.json"
          {
            echo "# Import JB $JB_ID"
            echo ""
            if [ -f "$REPORT" ]; then
              echo "## 📊 Reporte"
              echo '```json'
              cat "$REPORT" | python3 -c "
          import sys, json
          d=json.load(sys.stdin)
          out={k:d[k] for k in ('jb_id','proyecto_id','fields_extracted','photos_uploaded','planos_uploaded','docs_uploaded','duration_s') if k in d}
          out['errors']=len(d.get('errors',[]))
          out['warnings']=len(d.get('warnings',[]))
          print(json.dumps(out, indent=2, default=str))
          "
              echo '```'
              if [ -f "imports/$JB_ID/verify/SUMMARY.md" ]; then
                echo ""
                cat "imports/$JB_ID/verify/SUMMARY.md"
              fi
            else
              echo "❌ No se generó report.json — import falló"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-${{ github.event.inputs.jb_id }}-${{ github.run_id }}
          path: imports/
          retention-days: 30
          if-no-files-found: warn
