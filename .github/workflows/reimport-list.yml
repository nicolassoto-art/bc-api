name: Re-import lista (proyectos sin unidades)

on:
  workflow_dispatch: {}

concurrency:
  group: import-jb-serial   # comparte serialización con import-jb si aplica
  cancel-in-progress: false

jobs:
  reimport:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install httpx
      - name: Login bc-api → JWT
        env:
          BC_API_PASSWORD: ${{ secrets.BC_API_PASSWORD }}
        run: |
          set -euo pipefail
          JWT=$(python3 -c "
          import os, httpx, sys
          r = httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',
              json={'email':'nicolas.soto@bigcapital.cl','password':os.environ['BC_API_PASSWORD']},
              timeout=15)
          if r.status_code != 200: sys.exit(1)
          print(r.json()['access_token'])
          ")
          echo "::add-mask::$JWT"
          echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - name: Re-importar lista
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/reimport_list.py
      - name: 🚨 Issue si falla
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `🚨 reimport-list falló — run ${{ github.run_id }}`,
              body: `[Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              labels: ['import-failure', 'auto-alert'],
            });
