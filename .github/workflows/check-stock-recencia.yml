name: Check stock recencia (solo lectura)

on:
  workflow_dispatch:
    inputs:
      filtro:
        description: 'Texto a buscar en inmobiliaria/nombre (ej: "aj urbana")'
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - name: Login bc-api → JWT
        env:
          BC_API_PASSWORD: ${{ secrets.BC_API_PASSWORD }}
        run: |
          JWT=$(python3 -c "
          import os, httpx, sys
          r = httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',
              json={'email': 'nicolas.soto@bigcapital.cl', 'password': os.environ['BC_API_PASSWORD']},
              timeout=15.0)
          if r.status_code != 200: sys.exit(1)
          print(r.json()['access_token'])
          ")
          echo "::add-mask::$JWT"
          echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - env:
          FILTRO: ${{ github.event.inputs.filtro }}
        run: python3 scripts/check_stock_recencia.py
