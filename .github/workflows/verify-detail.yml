name: Verify detail import
on:
  workflow_dispatch:
    inputs:
      pid: { description: 'bc-api id', required: false, default: 'etapa-2-portal-del-pinar' }
concurrency: { group: verify-detail, cancel-in-progress: false }
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - name: Login bc-api
        env: { BC_API_PASSWORD: "${{ secrets.BC_API_PASSWORD }}" }
        run: |
          JWT=$(python3 -c "import os,httpx,time
          for i in range(6):
            try:
              r=httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',json={'email':'nicolas.soto@bigcapital.cl','password':os.environ['BC_API_PASSWORD']},timeout=15)
              if r.status_code==200: print(r.json()['access_token']); break
            except: pass
            time.sleep(4)")
          echo "::add-mask::$JWT"; echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - env: { PID_BC: "${{ inputs.pid || 'etapa-2-portal-del-pinar' }}" }
        run: python3 scripts/verify_detail.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: verify, path: imports/_verify/, retention-days: 14 }
