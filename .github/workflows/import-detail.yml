name: Import detail (proyecto propio)
on:
  workflow_dispatch:
    inputs:
      id:    { description: 'jb id nuevo (o usa link)', required: false, default: 'exrBr6Tp' }
      link:  { description: 'link /projects/detail/{id}', required: false, default: '' }
      dry:   { description: 'DRY_RUN (1=no escribe, 0=importa)', required: false, default: '1' }
concurrency: { group: import-detail, cancel-in-progress: false }
jobs:
  imp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - name: Login bc-api → JWT
        env: { BC_API_PASSWORD: "${{ secrets.BC_API_PASSWORD }}" }
        run: |
          JWT=$(python3 -c "import os,httpx,sys
          for i in range(6):
            try:
              r=httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',json={'email':'nicolas.soto@bigcapital.cl','password':os.environ['BC_API_PASSWORD']},timeout=15)
              if r.status_code==200: print(r.json()['access_token']); break
            except: pass
            import time; time.sleep(4)")
          echo "::add-mask::$JWT"; echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - name: Import
        env:
          JETBROKERS_EMAIL: ${{ secrets.JETBROKERS_EMAIL }}
          JETBROKERS_PASS:  ${{ secrets.JETBROKERS_PASS }}
          DIAG_ID:          ${{ inputs.id }}
          DIAG_LINK:        ${{ inputs.link }}
          DRY_RUN:          ${{ inputs.dry }}
        run: python3 scripts/import_detail.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: import-detail, path: imports/_detail/, retention-days: 14 }
