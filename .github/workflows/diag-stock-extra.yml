name: Diag stock extra (estac/bodegas)
on: { workflow_dispatch: { inputs: { id: { required: false, default: 'exrBr6Tp' } } } }
concurrency: { group: diag-stock-extra, cancel-in-progress: false }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install --upgrade pip && pip install -r requirements.txt && python -m playwright install chromium --with-deps
      - env: { JETBROKERS_EMAIL: "${{ secrets.JETBROKERS_EMAIL }}", JETBROKERS_PASS: "${{ secrets.JETBROKERS_PASS }}", DIAG_ID: "${{ inputs.id || 'exrBr6Tp' }}" }
        run: python3 scripts/diag_stock_extra.py
