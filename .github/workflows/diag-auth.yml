name: Diag Auth (401 version/token)
on:
  workflow_dispatch:
    inputs:
      id:
        description: 'store id'
        required: false
        default: 'XZvaYdNg'
concurrency: { group: diag-auth, cancel-in-progress: false }
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - env:
          JETBROKERS_EMAIL: ${{ secrets.JETBROKERS_EMAIL }}
          JETBROKERS_PASS:  ${{ secrets.JETBROKERS_PASS }}
          DIAG_ID:          ${{ inputs.id || 'XZvaYdNg' }}
        run: python3 scripts/diag_auth.py
