name: Import batch (todos los pendientes)
on: { workflow_dispatch: {} }

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install --upgrade pip && pip install -r requirements.txt && python -m playwright install chromium --with-deps

      - name: Login bc-api → JWT
        env: { BC_API_PASSWORD: "${{ secrets.BC_API_PASSWORD }}" }
        run: |
          JWT=$(python3 -c "import os,httpx,time
          for i in range(8):
            try:
              r=httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',json={'email':'nicolas.soto@bigcapital.cl','password':os.environ['BC_API_PASSWORD']},timeout=15)
              if r.status_code==200: print(r.json()['access_token']); break
            except: pass
            time.sleep(4)")
          echo "::add-mask::$JWT"; echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"

      - name: Run batch
        env:
          JETBROKERS_EMAIL: "${{ secrets.JETBROKERS_EMAIL }}"
          JETBROKERS_PASS:  "${{ secrets.JETBROKERS_PASS }}"
        run: |
          # Ranking de mayor a menor stock, excluidos: Borja Plaza, Terrazzo, Abdón Cifuentes, Bosquemar (ya).
          IDS=(
            mshykABZ LmVJgz7F ImxDl3nl C8R7VcvH 9YO68rOa W8P6QggB
            kUYM4Rl8 wHL2AUKl Ml02Ecl7 WGfF1Hcm Ao8J0BvU nmLpNNTD
            osnL3M1C m9zXfNHe RNEqQ6dw SUWJ0Rye OHpd4zbx 75PDpryA
            3Av5Af58 dr6uuHkX 4nyJKnq9 teQxJTnq iB3uhp34 LXXJ9agb
            nYjXw5kL hw9SoClo q8RwqXao zkp4Z7HH Sfp8j2Sq eHxgQsNq
            vWkZk19n pkR9sdRb KvRtrtXK 4Kny8VBw hSeBHnw1 Vw1zOkV6
            48t1IInf vWeKp0EM NgBHe0jo FrOy8Hxr C0xMpK4K f8VQHYVK
            IDLyBU4W atUiRS6M HvNRYfwm 3JcwgGZi hKtYFYuQ UAq8pgxr
            GMrPAyQt ksHJwBab 1gaVJbKl dX4Rddfn 7qF2CCA7 iaEIx5Eo
            5d7qpMgc sFfaXZIQ
          )
          TOTAL=${#IDS[@]}
          i=0
          for ID in "${IDS[@]}"; do
            i=$((i+1))
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "  [$i/$TOTAL] $ID"
            echo "═══════════════════════════════════════════════════════════════"
            export DIAG_LINK="https://app.jetbrokers.io/projects/edit/$ID"
            export DIAG_ID=""
            # paso 1: muestra 10%
            DRY_RUN=0 SAMPLE_PCT=10 python3 scripts/import_detail.py 2>&1 | tail -30 || echo "⚠ FAIL 10% en $ID"
            sleep 5
            # paso 2: import completo
            DRY_RUN=0 SAMPLE_PCT=100 python3 scripts/import_detail.py 2>&1 | tail -30 || echo "⚠ FAIL 100% en $ID"
            sleep 5
          done
          echo ""
          echo "════════ BATCH FINALIZADO ════════"
