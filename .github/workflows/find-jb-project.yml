name: Find JetBrokers project by name

# Búsqueda manual (login real + navegación) para proyectos que NO aparecen en
# list-jb-projects.yml (ese aplica el filtro Disponible=Sí + JetStock=No por defecto).
# Ver scripts/find_jb_project.py.

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Texto a buscar en el catálogo JB (ej: "Laguna Centro")'
        required: true

concurrency:
  group: import-jb-serial
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Buscar proyecto
        env:
          JETBROKERS_EMAIL: ${{ secrets.JETBROKERS_EMAIL }}
          JETBROKERS_PASS:  ${{ secrets.JETBROKERS_PASS }}
          HEADLESS:         '1'
        run: python3 scripts/find_jb_project.py "${{ github.event.inputs.query }}"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: find-jb-project-${{ github.run_id }}
          path: imports/_find/
          retention-days: 14
          if-no-files-found: warn
