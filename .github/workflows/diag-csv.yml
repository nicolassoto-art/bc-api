name: Diag CSV batch (read-only)
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install --upgrade pip && pip install -r requirements.txt && python -m playwright install chromium --with-deps
      - env: { BC_API_PASSWORD: "${{ secrets.BC_API_PASSWORD }}" }
        run: |
          JWT=$(python3 -c "import os,httpx,time
          for i in range(8):
            try:
              r=httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',json={'email':'nicolas.soto@bigcapital.cl','password':os.environ['BC_API_PASSWORD']},timeout=15)
              if r.status_code==200: print(r.json()['access_token']); break
            except: pass
            time.sleep(4)")
          echo "::add-mask::$JWT"; echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - env:
          JETBROKERS_EMAIL: "${{ secrets.JETBROKERS_EMAIL }}"
          JETBROKERS_PASS:  "${{ secrets.JETBROKERS_PASS }}"
        run: python3 scripts/diag_csv_batch.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: diag-csv, path: imports/_diag_csv/, retention-days: 14 }
