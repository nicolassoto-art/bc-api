name: Diag Rosas 1444
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install --upgrade pip && pip install -r requirements.txt && python -m playwright install chromium --with-deps
      - env: { JETBROKERS_EMAIL: "${{ secrets.JETBROKERS_EMAIL }}", JETBROKERS_PASS: "${{ secrets.JETBROKERS_PASS }}" }
        run: python3 scripts/diag_rosas.py
