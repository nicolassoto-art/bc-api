name: Diagnóstico · reuniones de las setters (solo lectura)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Diagnóstico
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          INSTALL_DIR: ${{ secrets.INSTALL_DIR || '/opt/bc-api' }}
          SERVICE_USER: ${{ secrets.SERVICE_USER || 'bcapi' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" bash -s <<EOF2
          cd $INSTALL_DIR && git fetch -q --depth 1 origin main && git show origin/main:scripts/diag_reuniones_setters.py > /tmp/diag_reuniones_setters.py
          echo "--- como $SERVICE_USER"; sudo -u $SERVICE_USER $INSTALL_DIR/.venv/bin/python /tmp/diag_reuniones_setters.py
          echo "--- como usuario de despliegue"; python3 /tmp/diag_reuniones_setters.py; ls -l /opt/bigcapital-dashboard/data/latest.json; stat -c "%U:%G %a" /opt/bigcapital-dashboard/data /opt/bigcapital-dashboard/data/latest.json
          rm -f /tmp/diag_reuniones_setters.py
          EOF2
