name: Auditoría profunda modelos + stock

on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install httpx
      - name: Login bc-api → JWT
        env:
          BC_API_EMAIL: nicolas.soto@bigcapital.cl
          BC_API_PASSWORD: ${{ secrets.BC_API_PASSWORD }}
        run: |
          set -euo pipefail
          JWT=$(python3 -c "
          import os, httpx, sys
          r = httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',
              json={'email': os.environ['BC_API_EMAIL'], 'password': os.environ['BC_API_PASSWORD']},
              timeout=15.0)
          if r.status_code != 200: sys.exit(1)
          print(r.json()['access_token'])
          ")
          echo "::add-mask::$JWT"
          echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - name: Ejecutar auditoría
        run: python3 scripts/audit_modelos_stock.py
      - name: Subir artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-modelos-stock-${{ github.run_id }}
          path: |
            audit_modelos_stock.csv
            AUDITORIA_MODELOS_STOCK.md
          retention-days: 30
      - name: Commit audit MD al repo
        run: |
          git config user.name "BC Auditor"
          git config user.email "bot@bigcapital.cl"
          git add AUDITORIA_MODELOS_STOCK.md audit_modelos_stock.csv
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "audit: regenerar AUDITORIA_MODELOS_STOCK.md (run ${{ github.run_id }})"
            git push
          fi
