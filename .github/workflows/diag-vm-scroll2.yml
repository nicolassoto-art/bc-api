name: Diag vm scroll
on: { workflow_dispatch: { inputs: { id: { required: false, default: 'utPNS9kv' } } } }
concurrency: { group: diag-vm-scroll2, cancel-in-progress: false }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install --upgrade pip && pip install -r requirements.txt && python -m playwright install chromium --with-deps
      - env: { JETBROKERS_EMAIL: "${{ secrets.JETBROKERS_EMAIL }}", JETBROKERS_PASS: "${{ secrets.JETBROKERS_PASS }}", DIAG_ID: "${{ inputs.id || 'utPNS9kv' }}" }
        run: python3 scripts/diag_vm_scroll2.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: vm-scroll2, path: imports/_diag/, retention-days: 14 }
