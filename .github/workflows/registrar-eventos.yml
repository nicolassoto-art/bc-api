name: Registrar eventos anómalos

on:
  schedule:
    # Cada hora durante el día, todos los días
    - cron: '5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: registrar-eventos
  cancel-in-progress: true

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # commit del log al repo
      actions: read     # leer historial workflows
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install httpx
      - name: Login bc-api → JWT
        env:
          BC_API_EMAIL: nicolas.soto@bigcapital.cl
          BC_API_PASSWORD: ${{ secrets.BC_API_PASSWORD }}
        run: |
          set -euo pipefail
          JWT=$(python3 -c "
          import os, httpx, sys
          r = httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',
              json={'email': os.environ['BC_API_EMAIL'], 'password': os.environ['BC_API_PASSWORD']},
              timeout=15.0)
          if r.status_code != 200: sys.exit(1)
          print(r.json()['access_token'])
          ")
          echo "::add-mask::$JWT"
          echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - name: Detectar y registrar eventos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/registrar_eventos.py
      - name: Commit log si cambió
        run: |
          git config user.name "BC Event Logger"
          git config user.email "bot@bigcapital.cl"
          git add eventos_anomalos.jsonl EVENTOS.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios — log up-to-date"
          else
            git commit -m "log: nuevos eventos anómalos detectados"
            git push
          fi
