name: Dry-run project (solo lectura)
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Nombre del proyecto a validar'
        required: false
        default: 'Portal del Pinar Etapa 2'
      id:
        description: 'ID nuevo JB (opcional, salta resolución por nombre)'
        required: false
        default: ''
concurrency: { group: dryrun, cancel-in-progress: false }
jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - env:
          JETBROKERS_EMAIL: ${{ secrets.JETBROKERS_EMAIL }}
          JETBROKERS_PASS:  ${{ secrets.JETBROKERS_PASS }}
          DIAG_NAME:        ${{ inputs.name || 'Portal del Pinar Etapa 2' }}
          DIAG_ID:          ${{ inputs.id || '' }}
        run: python3 scripts/dryrun_project.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: dryrun, path: imports/_dryrun/, retention-days: 14 }
