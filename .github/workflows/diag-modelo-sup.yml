name: Diag modelo superficies
on:
  workflow_dispatch:
    inputs:
      jb_id: { default: '1kvflc3m' }
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt && python -m playwright install chromium --with-deps
      - name: Login
        env: { BC_API_PASSWORD: "${{ secrets.BC_API_PASSWORD }}" }
        run: |
          set -euo pipefail
          JWT=$(python3 -c "import os,httpx;print(httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',json={'email':'nicolas.soto@bigcapital.cl','password':os.environ['BC_API_PASSWORD']},timeout=15).json()['access_token'])")
          echo "::add-mask::$JWT"; echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - env:
          JETBROKERS_EMAIL: "${{ secrets.JETBROKERS_EMAIL }}"
          JETBROKERS_PASS: "${{ secrets.JETBROKERS_PASS }}"
          HEADLESS: '1'
          JB_ID: "${{ github.event.inputs.jb_id }}"
        run: python3 scripts/diag_modelo_superficies.py
