name: Diag Pipeline (API-first JB)
on: { workflow_dispatch: {} }
concurrency: { group: diag-pipeline, cancel-in-progress: false }
jobs:
  pipe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - env:
          JETBROKERS_EMAIL: ${{ secrets.JETBROKERS_EMAIL }}
          JETBROKERS_PASS:  ${{ secrets.JETBROKERS_PASS }}
        run: python3 scripts/diag_pipeline.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: pipeline, path: imports/_diag/, retention-days: 14 }
