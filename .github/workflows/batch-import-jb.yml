name: Batch import JB (encadenamiento dinámico, L-V 10-18 Chile)

on:
  # Cron solo PARA ARRANCAR la cadena cada día hábil: lunes-viernes 10:00 Chile.
  # Después, cada tanda:
  #   1. Importa 3 proyectos secuenciales (~18 min)
  #   2. Descansa 30 min DENTRO del workflow (sleep)
  #   3. Se auto-dispara la siguiente tanda vía gh workflow run
  # Si la siguiente tanda caería fuera de la ventana (>18:00 Chile o fin de
  # semana), la cadena se detiene y el cron del siguiente día hábil retoma.
  # Backup ticks cada hora en la ventana por si la cadena se rompe.
  schedule:
    - cron: '0 14-22 * * 1-5'   # L-V, 14:00-22:00 UTC = 10:00-18:00 Chile (cada hora, backup)
  # Para disparar manualmente desde la UI o con: gh workflow run batch-import-jb.yml
  workflow_dispatch: {}

# Solo permitir UNA ejecución a la vez (regla inviolable: secuencial).
concurrency:
  group: batch-import-jb
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 3 imports (~18 min) + 30 min sleep + buffer
    permissions:
      contents: read
      actions: write   # para poder triggear import-jb.yml desde aquí
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install httpx
      - name: Login bc-api → JWT
        env:
          BC_API_EMAIL: nicolas.soto@bigcapital.cl
          BC_API_PASSWORD: ${{ secrets.BC_API_PASSWORD }}
        run: |
          set -euo pipefail
          JWT=$(python3 -c "
          import os, httpx, sys
          r = httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',
              json={'email': os.environ['BC_API_EMAIL'], 'password': os.environ['BC_API_PASSWORD']},
              timeout=15.0)
          if r.status_code != 200: sys.exit(1)
          print(r.json()['access_token'])
          ")
          echo "::add-mask::$JWT"
          echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - name: Descargar lista JB pendiente (catálogo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JETBROKERS_EMAIL: ${{ secrets.JETBROKERS_EMAIL }}
          JETBROKERS_PASS:  ${{ secrets.JETBROKERS_PASS }}
        run: |
          set -e
          # Reutilizar el último artifact de list-jb-projects.yml si es reciente (<6h)
          # Si no existe o está stale, lanzarlo
          LATEST=$(gh run list --workflow=list-jb-projects.yml --limit 1 --json databaseId,createdAt,conclusion | python3 -c "
          import json, sys, datetime
          runs = json.load(sys.stdin)
          if not runs: print(''); exit()
          r = runs[0]
          if r['conclusion'] != 'success': print(''); exit()
          age_h = (datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))).total_seconds() / 3600
          print(r['databaseId'] if age_h < 24 else '')
          ")
          if [ -z "$LATEST" ]; then
            echo "Lanzando list-jb-projects.yml..."
            gh workflow run list-jb-projects.yml
            sleep 10
            LATEST=$(gh run list --workflow=list-jb-projects.yml --limit 1 --json databaseId -q '.[0].databaseId')
            echo "Esperando que termine..."
            until [ "$(gh run view "$LATEST" --json status -q .status)" = "completed" ]; do sleep 30; done
          fi
          mkdir -p _list_artifact
          gh run download "$LATEST" --dir _list_artifact
          # Buscar el JSON (puede estar dentro de un subdir)
          find _list_artifact -name 'jb_projects.json' -exec cp {} jb_projects.json \;
          ls -la jb_projects.json
      - name: Ejecutar tanda
        id: batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Capturar stdout para incluirlo en el email de alerta si falla
          python3 scripts/batch_import_jb.py --batch-size 3 --catalog jb_projects.json 2>&1 | tee batch_output.log
          EXIT=${PIPESTATUS[0]}
          echo "Batch exit code: $EXIT"
          # Capturar resumen para reporting
          tail -40 batch_output.log > batch_tail.log
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          # Exit codes:
          #   0 = quedan pendientes, ya encadené siguiente tanda
          #   1 = todo importado, fin
          #   2 = fuera de ventana, paro la cadena
          #   3 = error encadenando
          # Solo exit-fail (1+) si fue 3 o error real (no 1 o 2)
          if [ "$EXIT" -eq 3 ]; then exit 1; fi
          exit 0

      # ── ALERTA POR EMAIL si algo falló ──────────────────────────────────
      - name: 📧 Email alerta (si falla la tanda)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.ALERT_SMTP_USER }}
          password: ${{ secrets.ALERT_SMTP_PASS }}
          from: 'BC Import Bot <${{ secrets.ALERT_SMTP_USER }}>'
          to: ${{ secrets.ALERT_EMAIL_TO }}
          subject: '🚨 BC Import Failure — run ${{ github.run_id }}'
          body: |
            La tanda batch-import-jb falló.

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Trigger: ${{ github.event_name }}
            Job: ${{ github.job }}
            Exit code: ${{ steps.batch.outputs.exit_code }}

            Últimas 40 líneas del output:
          attachments: batch_tail.log
          ignore_cert: true

      # ── ALERTA si una IMPORTACIÓN individual de proyecto falló ─────────
      # (incluso si la tanda exit 0, puede haber proyectos individuales que fallaron)
      - name: 📧 Email alerta (si algún proyecto individual falló)
        if: success() && steps.batch.outputs.exit_code != '1'
        run: |
          # Detectar líneas con ❌ en el output del batch
          if grep -q '❌' batch_output.log; then
            echo "FAILED_PROJECTS=$(grep '❌' batch_output.log | head -10)" >> "$GITHUB_ENV"
            echo "HAS_FAILED=1" >> "$GITHUB_ENV"
          fi

      - name: 📧 Send partial-failure email
        if: env.HAS_FAILED == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.ALERT_SMTP_USER }}
          password: ${{ secrets.ALERT_SMTP_PASS }}
          from: 'BC Import Bot <${{ secrets.ALERT_SMTP_USER }}>'
          to: ${{ secrets.ALERT_EMAIL_TO }}
          subject: '⚠ BC Import: algún proyecto falló en tanda ${{ github.run_id }}'
          body: |
            Tanda terminó pero al menos 1 proyecto falló.

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Proyectos que fallaron:
            ${{ env.FAILED_PROJECTS }}

            La tanda continuó con los restantes y la cadena sigue.
          attachments: batch_tail.log
          ignore_cert: true
