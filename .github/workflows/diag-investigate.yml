name: Diag investigate (Terrazzo + 0-uds + Abdón)
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install --upgrade pip && pip install -r requirements.txt && python -m playwright install chromium --with-deps
      - env: { JETBROKERS_EMAIL: "${{ secrets.JETBROKERS_EMAIL }}", JETBROKERS_PASS: "${{ secrets.JETBROKERS_PASS }}" }
        run: python3 scripts/diag_investigate.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: investigate, path: imports/_invest/, retention-days: 14 }
