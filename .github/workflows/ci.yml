name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bcapi
          POSTGRES_PASSWORD: bcapi
          POSTGRES_DB: bcapi
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bcapi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://bcapi:bcapi@localhost:5432/bcapi
      JWT_SECRET: ci-test-secret-not-for-prod
      UPLOAD_DIR: ./uploads
      CORS_ORIGINS: http://localhost
      SUPER_ADMINS: admin@test.local
      ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest -q

      - name: Smoke (app import + /health)
        run: |
          python -c "from app.main import app; print('routes:', len(app.routes))"
