name: Scrape superficies individuales (5 sin desglose)
on:
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - name: Login bc-api
        env:
          BC_API_PASSWORD: ${{ secrets.BC_API_PASSWORD }}
        run: |
          set -euo pipefail
          JWT=$(python3 -c "
          import os, httpx, time
          for i in range(5):
            try:
              r = httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',
                  json={'email':'nicolas.soto@bigcapital.cl','password':os.environ['BC_API_PASSWORD']},timeout=15)
              if r.status_code == 200:
                print(r.json()['access_token']); break
            except: pass
            time.sleep(5)
          ")
          echo "::add-mask::$JWT"
          echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - name: Scrape superficies
        env:
          JETBROKERS_EMAIL: ${{ secrets.JETBROKERS_EMAIL }}
          JETBROKERS_PASS:  ${{ secrets.JETBROKERS_PASS }}
          HEADLESS: '1'
        run: python3 scripts/scrape_superficies_individual.py
