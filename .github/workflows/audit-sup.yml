name: Audit superficies
on:
  workflow_dispatch:
    inputs:
      pid: { default: 'edificio-u-oa-za-artu-Sfp8j2Sq' }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install httpx
      - env: { BC_API_PASSWORD: "${{ secrets.BC_API_PASSWORD }}" }
        run: |
          JWT=$(python3 -c "import os,httpx;print(httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',json={'email':'nicolas.soto@bigcapital.cl','password':os.environ['BC_API_PASSWORD']},timeout=15).json()['access_token'])")
          echo "::add-mask::$JWT"
          python3 -c "
          import httpx,sys
          jwt='$JWT'
          cli=httpx.Client(base_url='https://bc-api.178-105-91-29.nip.io',headers={'Authorization':f'Bearer {jwt}'},timeout=30)
          p=cli.get('/proyectos/${{ github.event.inputs.pid }}').json()
          us=p.get('unidades',[])
          print(f'Total unidades: {len(us)}')
          for u in us[:10]:
              print(f\"  #{u.get('numero')} ST={u.get('sup_total')} Int={u.get('sup_interior')} Terr={u.get('sup_terraza')} Log={u.get('sup_logia')} Jar={u.get('sup_jardin')}\")
          import collections
          c=collections.Counter()
          for u in us:
              for f in ('sup_total','sup_interior','sup_terraza','sup_logia','sup_jardin'):
                  if u.get(f) and float(u.get(f) or 0)>0: c[f]+=1
          print(f'\nCobertura {len(us)} deptos:')
          for f in ('sup_total','sup_interior','sup_terraza','sup_logia','sup_jardin'):
              print(f'  {f}: {c[f]}/{len(us)}')
          "
