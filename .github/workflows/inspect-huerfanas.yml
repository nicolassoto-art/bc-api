name: Inspect huérfanas
on:
  workflow_dispatch: {}
jobs:
  i:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - name: Login
        env:
          BC_API_PASSWORD: ${{ secrets.BC_API_PASSWORD }}
        run: |
          JWT=$(python3 -c "
          import os, httpx
          r=httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',json={'email':'nicolas.soto@bigcapital.cl','password':os.environ['BC_API_PASSWORD']},timeout=15)
          print(r.json()['access_token'])
          ")
          echo "::add-mask::$JWT"
          echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - name: Inspect
        run: python3 -c "
          import os, httpx
          jwt = os.environ['BC_API_JWT']
          cli = httpx.Client(base_url='https://bc-api.178-105-91-29.nip.io', headers={'Authorization': f'Bearer {jwt}'}, timeout=30)
          for pid in ['jb-g3jwrroe', 'jb-9mubheq8', 'jb-c0xmpk4k', 'jb-kvrtrtxk', 'jb-86yw1rpt']:
              r = cli.get(f'/proyectos/{pid}').json()
              extra = r.get('extra') or {}
              modelos = extra.get('modelos') or []
              unidades = r.get('unidades') or []
              m_names = sorted(set((m.get('nombre') or '').strip() for m in modelos if isinstance(m, dict)))
              u_modelos = sorted(set((u.get('modelo') or '').strip() for u in unidades))
              print(f'=== {r.get(\"nombre\")} ({pid}) ===')
              print(f'  Modelos ({len(m_names)}): {m_names[:15]}')
              print(f'  Unidades.modelo distintos ({len(u_modelos)}): {u_modelos[:15]}')
          "
