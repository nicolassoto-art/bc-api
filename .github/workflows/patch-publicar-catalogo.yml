name: Patch publicar_en_catalogo

# Activa/desactiva extra.publicar_en_catalogo. Sin ese flag el worker del catálogo
# no toma el proyecto como SBC. Ver scripts/patch_publicar_catalogo.py.

on:
  workflow_dispatch:
    inputs:
      proyecto_id:
        description: 'ID del proyecto en bc-api (ej: jb-1zvx7adn)'
        required: true
      valor:
        description: 'true = publicar en catálogo, false = despublicar'
        required: false
        default: 'true'

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - name: Login bc-api → JWT
        env:
          BC_API_PASSWORD: ${{ secrets.BC_API_PASSWORD }}
        run: |
          JWT=$(python3 -c "
          import os, httpx, sys
          r = httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',
              json={'email': 'nicolas.soto@bigcapital.cl', 'password': os.environ['BC_API_PASSWORD']},
              timeout=15.0)
          if r.status_code != 200: sys.exit(1)
          print(r.json()['access_token'])
          ")
          echo "::add-mask::$JWT"
          echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - env:
          PID: ${{ github.event.inputs.proyecto_id }}
          VALOR: ${{ github.event.inputs.valor }}
        run: python3 scripts/patch_publicar_catalogo.py
