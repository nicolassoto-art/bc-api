name: Diagnóstico · registros de Zadarma en bc-api (solo lectura)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Registros
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" bash -s <<'EOF2'
          if [ "$(id -u)" = "0" ]; then SUDO=""; else SUDO="sudo"; fi
          L=$($SUDO journalctl -u bc-api --since "3 days ago" --no-pager 2>/dev/null)
          echo "--- avisos aceptados por evento"
          echo "$L" | grep -o "zadarma: evento=[A-Z_]*" | sort | uniq -c
          echo "--- firmas inválidas por evento"
          echo "$L" | grep -o "zadarma: firma inválida evento=[A-Z_]*" | sort | uniq -c
          echo "--- avisos desde IP fuera de rango"
          echo "$L" | grep -c "IP fuera del rango"
          echo "--- respuestas del webhook en Caddy (código)"
          $SUDO grep -h '/webhooks/zadarma' /var/log/caddy/bc-api.log 2>/dev/null | python3 -c '
          import sys, json, collections
          c = collections.Counter()
          ips = collections.Counter()
          for line in sys.stdin:
              try: d = json.loads(line)
              except Exception: continue
              r = d.get("request", {})
              c[(r.get("method"), d.get("status"))] += 1
              ips[r.get("remote_ip") or r.get("client_ip")] += 1
          print("método/código:", dict(c)); print("IPs de origen:", dict(ips))'
          echo "--- errores del sincronizador y evaluador"
          echo "$L" | grep -E "zadarma: falló|evaluador: (falló|error)" | tail -5 | cut -c1-220
          EOF2
