name: Cargar proyecto a stock propio

# Carga (o actualiza) un proyecto de stock propio desde datos ya guardados en
# scripts/data/<carpeta>/ (ficha.json + unidades.csv). Ninguna petición va directo a
# JetBrokers: las imágenes se piden por nuestro Worker. Ver scripts/proyecto_propio/.
# aplicar=false (por defecto) es un ensayo: solo lee y muestra lo que haría.

on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: 'Carpeta en scripts/data/ (ej: laguna_centro_torre_h)'
        required: true
        default: 'laguna_centro_torre_h'
      aplicar:
        description: 'true = escribe en bc-api; false = ensayo'
        required: true
        default: 'false'

concurrency:
  group: cargar-proyecto-propio
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Login bc-api → JWT
        env:
          BC_API_PASSWORD: ${{ secrets.BC_API_PASSWORD }}
        run: |
          JWT=$(python3 -c "
          import os, httpx, sys
          r = httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',
              json={'email': 'nicolas.soto@bigcapital.cl', 'password': os.environ['BC_API_PASSWORD']},
              timeout=15.0)
          if r.status_code != 200: sys.exit(1)
          print(r.json()['access_token'])
          ")
          echo "::add-mask::$JWT"
          echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"
      - name: Cargar
        env:
          BC_API_BASE: https://bc-api.178-105-91-29.nip.io
          CARPETA: ${{ github.event.inputs.carpeta }}
          APLICAR: ${{ github.event.inputs.aplicar }}
        run: |
          case "$CARPETA" in *[!a-z0-9_]*|"") echo "Carpeta inválida"; exit 1;; esac
          FLAG=""; [ "$APLICAR" = "true" ] && FLAG="--aplicar"
          python -m scripts.proyecto_propio.cargar --datos "scripts/data/$CARPETA" $FLAG
