name: Import JetBrokers marketplace project

# Importa un proyecto de OTRA inmobiliaria agregado a nuestro catálogo de
# reventa en JetBrokers (/marketplace/workview/{id}), distinto de import-jb.yml
# (que es para /projects/edit/{id}, proyectos propios). Ver
# scripts/import_marketplace_workview.py.

on:
  workflow_dispatch:
    inputs:
      jb_id:
        description: 'JetBrokers id (ej: IquFoRoO)'
        required: true
      dry_run:
        description: 'true = solo scrapea y muestra resumen, no sube nada'
        required: false
        default: 'true'

concurrency:
  group: import-jb-serial
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Login bc-api → JWT
        env:
          BC_API_EMAIL: nicolas.soto@bigcapital.cl
          BC_API_PASSWORD: ${{ secrets.BC_API_PASSWORD }}
        run: |
          set -euo pipefail
          JWT=$(python3 -c "
          import os, httpx, sys
          r = httpx.post('https://bc-api.178-105-91-29.nip.io/auth/login',
              json={'email': os.environ['BC_API_EMAIL'], 'password': os.environ['BC_API_PASSWORD']},
              timeout=15.0)
          if r.status_code != 200: sys.exit(1)
          print(r.json()['access_token'])
          ")
          echo "::add-mask::$JWT"
          echo "BC_API_JWT=$JWT" >> "$GITHUB_ENV"

      - name: Importar proyecto marketplace
        env:
          JETBROKERS_EMAIL: ${{ secrets.JETBROKERS_EMAIL }}
          JETBROKERS_PASS:  ${{ secrets.JETBROKERS_PASS }}
          HEADLESS:         '1'
        run: |
          set -euo pipefail
          ARGS="${{ github.event.inputs.jb_id }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/import_marketplace_workview.py $ARGS

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-marketplace-${{ github.event.inputs.jb_id }}-${{ github.run_id }}
          path: imports/
          retention-days: 14
          if-no-files-found: warn
